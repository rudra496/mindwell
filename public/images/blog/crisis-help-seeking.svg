      <stop offset="0%" style="stop-color:#c94b4b"/>
      <stop offset="100%" style="stop-color:#4b134f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Phone icon -->
  <rect x="530" y="140" width="140" height="220" rx="18" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
  <circle cx="600" cy="330" r="12" fill="rgba(255,255,255,0.55)"/>
  <rect x="570" y="155" width="60" height="8" rx="4" fill="rgba(255,255,255,0.40)"/>
