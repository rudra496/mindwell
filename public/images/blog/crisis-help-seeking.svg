  <text x="600" y="460" font-family="system-ui, sans-serif" font-size="46" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">When to Seek Crisis Help</text>
  <text x="600" y="515" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,200,200,0.85)" text-anchor="middle">Recognising when to reach out — and how</text>
  <text x="600" y="590" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,200,200,0.50)" text-anchor="middle">MindWell · Mental Health Education</text>
