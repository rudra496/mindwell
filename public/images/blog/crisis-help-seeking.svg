  <path d="M450,200 Q480,180 510,200" fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="3"/>
  <path d="M400,175 Q450,145 500,175" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
