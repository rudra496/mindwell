<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Social Anxiety illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee9ca7"/>
      <stop offset="100%" style="stop-color:#ffdde1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Group of circles representing people -->
  <circle cx="500" cy="300" r="60" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="650" cy="270" r="60" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="800" cy="300" r="60" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Lone circle with barrier -->
  <circle cx="280" cy="300" r="55" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Connecting lines between group -->
  <line x1="500" y1="300" x2="650" y2="270" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="650" y1="270" x2="800" y2="300" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="800" y1="300" x2="500" y2="300" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- Arrow toward group (hope/connection) -->
  <path d="M340,300 Q400,280 450,295" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="450,288 465,295 450,302" fill="rgba(255,255,255,0.5)"/>
  <text x="600" y="460" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="rgba(80,30,60,0.90)" text-anchor="middle">Social Anxiety</text>
  <text x="600" y="515" font-family="system-ui, sans-serif" font-size="22" fill="rgba(80,30,60,0.70)" text-anchor="middle">Building connection step by step</text>
  <text x="600" y="590" font-family="system-ui, sans-serif" font-size="18" fill="rgba(80,30,60,0.45)" text-anchor="middle">MindWell · Mental Health Education</text>
</svg>
