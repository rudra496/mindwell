  <circle cx="1150" cy="120" r="3" fill="rgba(255,255,200,0.7)"/>
  <circle cx="80" cy="200" r="2" fill="rgba(255,255,200,0.5)"/>
  <circle cx="550" cy="150" r="2" fill="rgba(255,255,200,0.7)"/>
  <circle cx="820" cy="30" r="3" fill="rgba(255,255,200,0.8)"/>
