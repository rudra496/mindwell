  <text x="600" y="360" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Sleep Hygiene</text>
  <text x="600" y="415" font-family="system-ui, sans-serif" font-size="24" fill="rgba(200,220,255,0.80)" text-anchor="middle">Build habits for restorative, healthy sleep</text>
  <text x="600" y="570" font-family="system-ui, sans-serif" font-size="18" fill="rgba(200,220,255,0.50)" text-anchor="middle">MindWell · Mental Health Education</text>
