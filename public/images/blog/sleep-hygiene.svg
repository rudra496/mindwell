      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="50%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#0d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="3" fill="rgba(255,255,200,0.9)"/>
  <circle cx="300" cy="50" r="2" fill="rgba(255,255,200,0.7)"/>
  <circle cx="450" cy="100" r="4" fill="rgba(255,255,200,0.8)"/>
  <circle cx="700" cy="60" r="2" fill="rgba(255,255,200,0.9)"/>
