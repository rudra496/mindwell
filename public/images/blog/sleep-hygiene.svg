  <text x="380" y="230" font-family="system-ui, sans-serif" font-size="60" fill="rgba(255,255,255,0.10)" font-weight="700">z</text>
  <text x="430" y="195" font-family="system-ui, sans-serif" font-size="40" fill="rgba(255,255,255,0.08)" font-weight="700">z</text>
