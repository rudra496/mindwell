  <!-- Arrow connecting them -->
  <path d="M250,200 Q420,160 580,200 Q740,240 860,200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="600" y="400" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Emotional Regulation</text>
  <text x="600" y="455" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.80)" text-anchor="middle">Skills to navigate difficult feelings</text>
  <text x="600" y="590" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">MindWell · Mental Health Education</text>
