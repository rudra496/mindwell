<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mindfulness illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f9b8e"/>
      <stop offset="100%" style="stop-color:#1a6b3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Concentric rings (meditation) -->
  <circle cx="600" cy="280" r="220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="600" cy="280" r="170" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <circle cx="600" cy="280" r="120" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="2"/>
  <circle cx="600" cy="280" r="70" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.30)" stroke-width="2"/>
  <!-- Lotus petals simplified -->
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(0 600 280)"/>
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(60 600 280)"/>
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(120 600 280)"/>
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(180 600 280)"/>
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(240 600 280)"/>
  <ellipse cx="600" cy="230" rx="30" ry="50" fill="rgba(255,255,255,0.15)" transform="rotate(300 600 280)"/>
  <!-- Text -->
  <text x="600" y="490" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Mindfulness</text>
  <text x="600" y="545" font-family="system-ui, sans-serif" font-size="24" fill="rgba(255,255,255,0.80)" text-anchor="middle">Present-moment awareness for mental wellbeing</text>
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">MindWell · Mental Health Education</text>
</svg>
