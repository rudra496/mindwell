<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Stress Relief illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="150" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1000" cy="480" r="200" fill="rgba(255,255,255,0.06)"/>
  <!-- Wave pattern -->
  <path d="M0,400 Q150,350 300,400 Q450,450 600,400 Q750,350 900,400 Q1050,450 1200,400 L1200,630 L0,630Z" fill="rgba(255,255,255,0.08)"/>
  <path d="M0,450 Q200,410 400,450 Q600,490 800,450 Q1000,410 1200,450 L1200,630 L0,630Z" fill="rgba(255,255,255,0.06)"/>
  <!-- Heart rate line -->
  <polyline points="100,310 250,310 300,250 350,370 400,310 550,310 600,270 640,350 680,310 850,310 900,280 940,340 980,310 1100,310" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-linejoin="round"/>
  <text x="600" y="200" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Stress Relief</text>
  <text x="600" y="255" font-family="system-ui, sans-serif" font-size="24" fill="rgba(255,255,255,0.80)" text-anchor="middle">Practical tools to reduce daily stress</text>
  <text x="600" y="575" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">MindWell · Mental Health Education</text>
</svg>
