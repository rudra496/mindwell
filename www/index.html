<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MindWell</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, #0d9488, #0f172a); color: #fff; text-align: center; }
  .card { padding: 2rem; max-width: 22rem; }
  .mark { font-size: 2.6rem; margin-bottom: .5rem; }
  h1 { font-size: 1.35rem; margin: .25rem 0 .75rem; }
  p { font-size: .95rem; line-height: 1.5; opacity: .9; margin: 0 0 1.25rem; }
  a.btn { display: inline-block; padding: .7rem 1.4rem; border-radius: 999px; background: #fff;
          color: #0f766e; font-weight: 600; text-decoration: none; }
  .hint { margin-top: 1rem; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🧠</div>
    <h1>MindWell</h1>
    <p>This screen is only a fallback. MindWell loads its full experience from the internet — please check your connection and reopen the app.</p>
    <a class="btn" href="https://www.getmindwell.us">Open MindWell</a>
    <p class="hint">Free, ethical mental-health support · getmindwell.us</p>
  </div>
</body>
</html>
