src:
  - changed-files:
      - any-glob-to-any-file: "src/**"

components:
  - changed-files:
      - any-glob-to-any-file: "src/components/**"

content:
  - changed-files:
      - any-glob-to-any-file: "content/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "*.config.*"
          - "tsconfig.json"
          - ".env*"
