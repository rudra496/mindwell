version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # typescript >=7 cannot resolve here: eslint-config-next@16.3.x bundles
      # @typescript-eslint/typescript-estree (peers <6.1.0). The 6.x line is
      # managed directly at ~6.0.3 for the same reason.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint >=10 is unsupported by eslint-plugin-react (7.37.5, the latest,
      # peers <= ^9.7 - ESLint 10 removed context.getFilename). Dependabot
      # merged the 9 -> 10 bump on 2026-09-04 because CI never runs lint;
      # it crashed the toolchain again within 25 minutes. Stay on 9.x until
      # eslint-plugin-react ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
