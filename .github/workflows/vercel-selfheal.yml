name: Vercel Self-Heal

# Autonomous redeploy for Vercel's free-tier rate limit. After a burst of
# failed builds Vercel returns "Deployment rate limited — retry in 24 hours"
# and the latest main commit can sit undeployed. This job periodically checks
# whether main HEAD has a successful Vercel deploy; if not, it pushes an empty
# commit to re-trigger Vercel (Vercel ignores [skip ci]). Once a deploy
# succeeds, the job becomes a no-op.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: read

concurrency:
  group: vercel-selfheal
  cancel-in-progress: false

jobs:
  retrigger:
    if: github.repository_owner == 'rudra496'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-trigger Vercel if HEAD lacks a successful deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          echo "main HEAD = $HEAD_SHA"
          VS=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context | test("[Vv]ercel")) | .state] | unique | join(",")' 2>/dev/null)
          echo "Vercel status on HEAD: ${VS:-none}"
          if printf '%s' "$VS" | grep -qi 'success'; then
            echo "HEAD already has a successful Vercel deploy — nothing to do."
            exit 0
          fi
          echo "No successful Vercel deploy for HEAD — creating empty commit to re-trigger."
          TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')
          NEW=$(gh api "repos/$REPO/git/commits" -X POST \
            -f message="chore: re-trigger Vercel deploy (self-heal) [skip ci]" \
            -f tree="$TREE" \
            -f "parents[]=$HEAD_SHA" --jq '.sha')
          # force defaults to false (fast-forward); never force-update main.
          gh api "repos/$REPO/git/refs/heads/main" -X PATCH -f sha="$NEW" >/dev/null
          echo "Created empty commit $NEW — Vercel will build it next."
